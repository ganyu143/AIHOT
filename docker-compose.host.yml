# 本机部署用这份（2026-10-22）。
# 原因：本机 docker 的 NAT 规则缺失（nat 表里没有 MASQUERADE），
# 容器出站 TCP 不通，采集抓不到信源；用 host 网络绕开，
# 并把 db/api/web 全部只绑 127.0.0.1，不暴露到局域网。
# 起服务：docker compose -f docker-compose.host.yml up -d  → http://127.0.0.1:3000
name: aihot

x-app: &app
  image: aihot-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  network_mode: host
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD}@127.0.0.1:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://127.0.0.1:3001
    # 本机直连海外站点被重置（ECONNRESET）：出海走应用自带的 egress 代理
    EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://127.0.0.1:2080}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=5432"]
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 127.0.0.1
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    stop_grace_period: 515s
    command: ["node", "apps/worker/src/main.ts"]
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    network_mode: host
    command: ["node", "apps/web/server.ts"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://127.0.0.1:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: "false"
      WEB_HOST: 127.0.0.1
      WEB_PORT: "3000"
    depends_on:
      api:
        condition: service_started

volumes:
  db: {}
  data: {}
